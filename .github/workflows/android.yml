# Especificação §7 e §8: testes e APK a cada push.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes (JVM + Robolectric)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: APK de debug
        run: ./gradlew assembleDebug --console=plain

      # Com os segredos de assinatura, gera também o release assinado com a chave estável
      # (instalar por cima da versão anterior). Sem eles, só o de debug.
      - name: APK de release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: estudos-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
